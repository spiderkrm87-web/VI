<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Anniversary Level 🎮</title>
    <!-- Google Font Pixel Art -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container Frame Rasio 9:16 Layar HP */
        .game-screen {
            width: 100vw;
            height: 100vh;
            max-width: 414px;
            max-height: 736px;
            background: #5c94fc;
            position: relative;
            box-shadow: 0 0 25px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .slide {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .slide.active {
            display: flex;
        }

        /* --- HALAMAN 1: START & PASSWORD --- */
        #slide1 {
            background: linear-gradient(to bottom, #6b8cff, #a0b5ff);
        }

        .mario-title {
            color: #ffe600;
            font-size: 1.1rem;
            text-shadow: 3px 3px #e60000;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .btn-pixel {
            background: #e60000;
            color: #fff;
            border: 4px solid #fff;
            padding: 12px 20px;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 0 5px #800000;
            margin-top: 15px;
            border-radius: 6px;
        }

        .btn-pixel:active {
            box-shadow: 0 2px #800000;
            transform: translateY(3px);
        }

        .pass-box {
            display: none;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
            align-items: center;
        }

        input[type="password"] {
            width: 80%;
            padding: 10px;
            font-size: 0.9rem;
            text-align: center;
            border: 3px solid #000;
            background: #fff;
            outline: none;
        }

        /* --- HALAMAN 2: ROADMAP LEVEL GAME --- */
        #slide2 {
            background: #7ec850;
            justify-content: space-between;
            padding: 20px 10px;
        }

        .level-container {
            width: 100%;
            height: 80%;
            position: relative;
            background: rgba(255, 255, 255, 0.2);
            border: 3px solid #000;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
        }

        .level-btn {
            background: #fff;
            border: 3px solid #000;
            padding: 8px 12px;
            font-size: 0.65rem;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 3px 3px #000;
            z-index: 2;
            width: 75%;
        }

        .cat-avatar {
            width: 35px;
            height: 35px;
            position: absolute;
            left: 10px;
            transition: all 0.5s ease-in-out;
            z-index: 5;
        }

        /* Modal Popup FOTO & VIDEO Level */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 20;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            border: 4px solid #000;
            padding: 15px;
            border-radius: 10px;
            max-width: 90%;
            text-align: center;
        }

        .modal-content img, .modal-content video {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border: 2px solid #000;
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 0.6rem;
            color: #000;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        /* --- HALAMAN 3: VIDEO PENUTUP --- */
        #slide3 {
            background: #000;
            padding: 15px;
        }

        #slide3 video {
            width: 100%;
            max-height: 75%;
            border: 3px solid #fff;
            border-radius: 8px;
        }

        .error-msg {
            color: #e60000;
            font-size: 0.55rem;
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="game-screen">

        <!-- AUDIO MARIO -->
        <audio id="marioAudio" loop>
            <source src="mario.mp3" type="audio/mpeg">
        </audio>

        <!-- HALAMAN 1 -->
        <div class="slide active" id="slide1">
            <div class="mario-title">SUPER ANNIVERSARY<br>BROS! 🪷🌙</div>
            <button class="btn-pixel" id="startBtn" onclick="showPass()">PRESS START</button>

            <div class="pass-box" id="passBox">
                <input type="password" id="passInput" placeholder="PASSCODE" maxlength="4">
                <span class="error-msg" id="errorMsg">WRONG PASSCODE!</span>
                <button class="btn-pixel" style="background:#00a2e8;" onclick="checkPass()">ENTER</button>
            </div>
        </div>

        <!-- HALAMAN 2 -->
        <div class="slide" id="slide2">
            <div style="color:#fff; text-shadow:2px 2px #000; font-size:0.8rem;">SELECT LEVEL 🗺</div>
            
            <div class="level-container">
                <!-- KUCING: kucing.png.jpg -->
                <img src="kucing.png.jpg" id="catAvatar" class="cat-avatar" style="top: 85%;" alt="Cat">

                <!-- LEVEL 5: video-fotbar.mp4.mp4 -->
                <button class="level-btn" onclick="playLevel(5, 'video-fotbar.mp4.mp4', 'LEVEL 5: FINISH! 🏆 Fotbar Paling Manis Bareng Kamu!', true)">LEVEL 5: FINISH 🏆</button>
                
                <!-- LEVEL 4: video-kenangan.mp4.mp4 -->
                <button class="level-btn" onclick="playLevel(4, 'video-kenangan.mp4.mp4', 'LEVEL 4: Video Momen Seru Kita! 🎥', true)">LEVEL 4: VIDEO 🎥</button>
                
                <!-- LEVEL 3: foto3.jpg.jph -->
                <button class="level-btn" onclick="playLevel(3, 'foto3.jpg.jph', 'LEVEL 3: Selalu Ada Buat Kamu 💖', false)">LEVEL 3: FOTO 3 📸</button>
                
                <!-- LEVEL 2: foto2.jpg.png -->
                <button class="level-btn" onclick="playLevel(2, 'foto2.jpg.png', 'LEVEL 2: Tawa Bareng Kamu 😊', false)">LEVEL 2: FOTO 2 📸</button>
                
                <!-- LEVEL 1: foto1.jpg.png -->
                <button class="level-btn" onclick="playLevel(1, 'foto1.jpg.png', 'LEVEL 1: Awal Mulai Cerita Kita 🧡', false)">LEVEL 1: FOTO 1 📸</button>
            </div>

            <button class="btn-pixel" id="btnToSlide3" style="background:#22b14c; display:none;" onclick="goToSlide3()">NEXT: SPECIAL ENDING 🎬</button>
        </div>

        <!-- POPUP MEDIA LEVEL -->
        <div class="modal" id="levelModal">
            <div class="modal-content">
                <div id="mediaContainer"></div>
                <p id="modalText"></p>
                <button class="btn-pixel" style="font-size:0.6rem; padding:8px;" onclick="closeModal()">CLOSE & NEXT</button>
            </div>
        </div>

        <!-- HALAMAN 3 -->
        <div class="slide" id="slide3">
            <div class="mario-title" style="font-size:0.75rem; margin-bottom:15px;">HAPPY ANNIVERSARY! ❤️️</div>
            <!-- VIDEO PENUTUP: video-penutup.mp4.mp4 -->
            <video controls id="endingVideo">
                <source src="video-penutup.mp4.mp4" type="video/mp4">
            </video>
            <p style="color:#fff; font-size:0.5rem; margin-top:15px; line-height:1.4;">
                Makasih Banyak ya yank, karna kamu masih mau kasih aa kesempatan. aa luar biasa sayang sama kamu, maaf kalo aa sering buat kamu jengkel. 
            </p>
        </div>

    </div>

    <script>
        const passCorrect = "1726";
        const marioAudio = document.getElementById("marioAudio");

        function showPass() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("passBox").style.display = "flex";
            marioAudio.play().catch(e => console.log("Autoplay ditahan browser"));
        }

        function checkPass() {
            const input = document.getElementById("passInput").value;
            if (input === passCorrect) {
                document.getElementById("slide1").classList.remove("active");
                document.getElementById("slide2").classList.add("active");
            } else {
                document.getElementById("errorMsg").style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }

        function playLevel(lvl, mediaSrc, text, isVideo) {
            const cat = document.getElementById("catAvatar");
            const positions = {1: '68%', 2: '50%', 3: '33%', 4: '17%', 5: '2%'};
            cat.style.top = positions[lvl];

            setTimeout(() => {
                const container = document.getElementById("mediaContainer");
                if (isVideo) {
                    container.innerHTML = `<video controls autoplay style="width:100%;"><source src="${mediaSrc}" type="video/mp4"></video>`;
                } else {
                    container.innerHTML = `<img src="${mediaSrc}" alt="Memory">`;
                }
                document.getElementById("modalText").innerText = text;
                document.getElementById("levelModal").style.display = "flex";

                if (lvl === 5) {
                    document.getElementById("btnToSlide3").style.display = "block";
                }
            }, 600);
        }

        function closeModal() {
            document.getElementById("levelModal").style.display = "none";
            document.getElementById("mediaContainer").innerHTML = "";
        }

        function goToSlide3() {
            document.getElementById("slide2").classList.remove("active");
            document.getElementById("slide3").classList.add("active");
            marioAudio.pause();
            document.getElementById("endingVideo").play();
        }
    </script>
</body>
</html>
