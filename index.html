<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Anniversary Bros 🎮</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', cursive;
        }

        body {
            background-color: #5c94fc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-screen {
            width: 100%;
            max-width: 400px;
            min-height: 100vh;
            background: #5c94fc;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .slide {
            width: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .slide.active {
            display: flex;
        }

        /* HALAMAN 1 */
        .mario-title {
            color: #ffe600;
            font-size: 0.9rem;
            text-shadow: 2px 2px #e60000;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-pixel {
            background: #e60000;
            color: #fff;
            border: 3px solid #fff;
            padding: 12px 18px;
            font-size: 0.7rem;
            cursor: pointer;
            box-shadow: 0 4px #800000;
            border-radius: 4px;
            margin-top: 10px;
        }

        .pass-box {
            display: none;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
            align-items: center;
            width: 100%;
        }

        input[type="password"] {
            width: 80%;
            padding: 10px;
            font-size: 0.8rem;
            text-align: center;
            border: 3px solid #000;
            outline: none;
        }

        /* HALAMAN 2 */
        .map-container {
            width: 100%;
            height: 480px;
            background: #7ec850;
            border: 4px solid #000;
            border-radius: 10px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            margin: 15px 0;
        }

        .level-btn {
            background: #fff;
            border: 3px solid #000;
            padding: 10px;
            font-size: 0.55rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 2px 2px #000;
            z-index: 2;
            width: 80%;
        }

        .cat-avatar {
            width: 32px;
            height: 32px;
            position: absolute;
            left: 8px;
            z-index: 5;
            transition: top 1s ease-in-out;
        }

        /* MODAL POPUP */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            z-index: 99;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #fff;
            border: 4px solid #000;
            padding: 15px;
            border-radius: 8px;
            width: 90%;
            max-width: 350px;
            text-align: center;
        }

        .modal-content img, .modal-content video {
            width: 100%;
            max-height: 220px;
            object-fit: contain;
            border: 2px solid #000;
            background: #000;
            margin-bottom: 10px;
        }

        .modal-content p {
            font-size: 0.55rem;
            color: #000;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        /* HALAMAN 3 */
        #slide3 video {
            width: 100%;
            max-height: 250px;
            border: 3px solid #fff;
            border-radius: 6px;
        }

        .error-msg {
            color: #e60000;
            font-size: 0.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-screen">

        <!-- AUDIO MARIO -->
        <audio id="marioAudio" loop>
            <source src="mario.mp3" type="audio/mpeg">
        </audio>

        <!-- HALAMAN 1 -->
        <div class="slide active" id="slide1">
            <div class="mario-title">SUPER ANNIVERSARY<br>BROS! 🪷🌙</div>
            <button class="btn-pixel" id="startBtn" onclick="showPass()">PRESS START</button>

            <div class="pass-box" id="passBox">
                <input type="password" id="passInput" placeholder="PASSCODE" maxlength="4">
                <span class="error-msg" id="errorMsg">WRONG PASSCODE!</span>
                <button class="btn-pixel" style="background:#00a2e8;" onclick="checkPass()">ENTER</button>
            </div>
        </div>

        <!-- HALAMAN 2 -->
        <div class="slide" id="slide2">
            <div style="color:#fff; text-shadow:2px 2px #000; font-size:0.7rem;">SELECT LEVEL 🗺</div>
            
            <div class="map-container">
                <img src="kucing.png.jpg" id="catAvatar" class="cat-avatar" style="top: 80%;" alt="Cat">

                <button class="level-btn" onclick="playLevel(5, 'video-fotbar.mp4', 'LEVEL 5: FINISH! 🏆 My treasure', true)">LEVEL 5: FINISH 🏆</button>
                <button class="level-btn" onclick="playLevel(4, 'video-kenangan.mp4', 'LEVEL 4: 🎥', true)">LEVEL 4: VIDEO 🎥</button>
                <button class="level-btn" onclick="playLevel(3, 'foto3.jpg', 'LEVEL 3: ', false)">LEVEL 3: FOTO 3 📸</button>
                <button class="level-btn" onclick="playLevel(2, 'foto2.jpg', 'LEVEL 2: ', false)">LEVEL 2: FOTO 2 📸</button>
                <button class="level-btn" onclick="playLevel(1, 'foto1.jpg', 'LEVEL 1: ', false)">LEVEL 1: FOTO 1 📸</button>
            </div>

            <button class="btn-pixel" id="btnToSlide3" style="background:#22b14c; display:none; font-size:0.55rem; width:100%;" onclick="goToSlide3()">NEXT: SPECIAL ENDING 🎬</button>
        </div>

        <!-- POPUP MEDIA LEVEL -->
        <div class="modal" id="levelModal">
            <div class="modal-content">
                <div id="mediaContainer"></div>
                <p id="modalText"></p>
                <button class="btn-pixel" style="font-size:0.5rem; padding:8px 10px;" onclick="closeModal()">CLOSE & NEXT</button>
            </div>
        </div>

        <!-- HALAMAN 3 -->
        <div class="slide" id="slide3">
            <div class="mario-title" style="font-size:0.7rem; margin-bottom:15px;">HAPPY ANNIVERSARY! ❤️</div>
            <video controls id="endingVideo">
                <source src="video-penutup.mp4" type="video/mp4">
            </video>
            <p style="color:#fff; font-size:0.5rem; margin-top:15px; line-height:1.5;">
                Makasih Banyak ya yank, karna kamu masih mau kasih aa kesempatan, aa luar biasa sayang sama kamu, maaf kalo aa sering buat kamu jengkel.
            </p>
        </div>

    </div>

    <script>
        const passCorrect = "1726";
        const marioAudio = document.getElementById("marioAudio");

        function showPass() {
            document.getElementById("startBtn").style.display = "none";
            document.getElementById("passBox").style.display = "flex";
            marioAudio.play().catch(e => console.log("Audio ditahan browser"));
        }

        function checkPass() {
            const input = document.getElementById("passInput").value;
            if (input === passCorrect) {
                document.getElementById("slide1").classList.remove("active");
                document.getElementById("slide2").classList.add("active");
            } else {
                document.getElementById("errorMsg").style.display = "block";
                document.getElementById("passInput").value = "";
            }
        }

        function playLevel(lvl, mediaSrc, text, isVideo) {
            const cat = document.getElementById("catAvatar");
            const positions = {1: '65%', 2: '48%', 3: '32%', 4: '16%', 5: '2%'};
            cat.style.top = positions[lvl];

            setTimeout(() => {
                const container = document.getElementById("mediaContainer");
                if (isVideo) {
                    container.innerHTML = `<video controls autoplay style="width:100%;"><source src="${mediaSrc}" type="video/mp4"></video>`;
                } else {
                    container.innerHTML = `<img src="${mediaSrc}" alt="Memory">`;
                }
                document.getElementById("modalText").innerText = text;
                document.getElementById("levelModal").style.display = "flex";

                if (lvl === 5) {
                    document.getElementById("btnToSlide3").style.display = "block";
                }
            }, 1000);
        }

        function closeModal() {
            document.getElementById("levelModal").style.display = "none";
            document.getElementById("mediaContainer").innerHTML = "";
        }

        function goToSlide3() {
            document.getElementById("slide2").classList.remove("active");
            document.getElementById("slide3").classList.add("active");
            marioAudio.pause();
            document.getElementById("endingVideo").play();
        }
    </script>
</body>
